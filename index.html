<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASIC Provider Course — Live Program</title>
<link rel="icon" href="basic-logo.png">
<style>
  :root {
    --navy: #14375e;
    --navy-dark: #0d2540;
    --gold: #c9a227;
    --gold-light: #fdf8e8;
    --teal: #0e6655;
    --red: #922b21;
    --blue: #1a5276;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1f2d3d;
    --muted: #7a8699;
    --line: #e3e9f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, #1d4b7c 100%);
    color: #fff;
    padding: 1.4rem 1rem 1.1rem;
    text-align: center;
    position: relative;
  }
  header img.logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #fff;
    padding: 4px;
    object-fit: contain;
    margin-bottom: .5rem;
  }
  header h1 { font-size: 1.25rem; letter-spacing: .02em; }
  header .sub { font-size: .85rem; opacity: .85; margin-top: .25rem; }
  header .gold-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--gold), #e8c95a, var(--gold));
  }
  .clock {
    display: inline-flex; align-items: center; gap: .45rem;
    margin-top: .7rem;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    padding: .3rem .9rem;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
  }
  .clock .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6ee7a0;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .45; transform: scale(.8); }
  }

  /* ---------- Live banner ---------- */
  .live-banner {
    max-width: 760px;
    margin: 1rem auto 0;
    padding: 0 1rem;
  }
  .live-banner .inner {
    background: linear-gradient(135deg, var(--teal), #0b4f43);
    color: #fff;
    border-radius: 14px;
    padding: .9rem 1.1rem;
    display: flex; align-items: center; gap: .9rem;
    box-shadow: 0 6px 18px rgba(14,102,85,.25);
  }
  .live-banner .inner.upcoming { background: linear-gradient(135deg, var(--blue), #123a54); box-shadow: 0 6px 18px rgba(26,82,118,.25); }
  .live-banner .inner.ended { background: linear-gradient(135deg, #5d6d7e, #46545f); box-shadow: none; }
  .live-banner .badge {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    padding: .2rem .6rem;
    border-radius: 999px;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .08em;
    white-space: nowrap;
    display: flex; align-items: center; gap: .35rem;
  }
  .live-banner .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b; animation: pulse 1.2s infinite; }
  .live-banner .info { flex: 1; min-width: 0; }
  .live-banner .info .topic { font-weight: 700; font-size: .98rem; }
  .live-banner .info .meta { font-size: .8rem; opacity: .85; margin-top: .15rem; }
  .live-banner .count { font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .95; text-align: right; }

  /* ---------- Tabs ---------- */
  .tabs {
    max-width: 760px;
    margin: 1rem auto 0;
    padding: 0 1rem;
    display: flex; gap: .6rem;
  }
  .tab {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: .6rem .5rem;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .tab .d { font-weight: 800; color: var(--navy); font-size: .95rem; }
  .tab .dt { font-size: .72rem; color: var(--muted); margin-top: .1rem; }
  .tab.active { border-color: var(--gold); background: var(--gold-light); }
  .tab.active .d { color: var(--navy-dark); }

  /* ---------- Schedule ---------- */
  .schedule {
    max-width: 760px;
    margin: 1rem auto 2rem;
    padding: 0 1rem;
  }
  .session {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--line);
    border-radius: 12px;
    padding: .8rem 1rem;
    margin-bottom: .55rem;
    display: flex; align-items: center; gap: .9rem;
    position: relative;
    transition: all .2s;
  }
  .session .time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: .82rem;
    color: var(--navy);
    min-width: 92px;
  }
  .session .body { flex: 1; min-width: 0; }
  .session .topic { font-weight: 600; font-size: .95rem; }
  .session .mod { font-size: .78rem; color: var(--muted); margin-top: .12rem; }
  .session .status {
    font-size: .68rem; font-weight: 700; letter-spacing: .06em;
    padding: .2rem .55rem; border-radius: 999px; white-space: nowrap;
  }
  .session.break { background: var(--gold-light); border-left-color: var(--gold); }
  .session.break .topic { color: #8a6d1a; }
  .session.done { opacity: .55; }
  .session.done .status { background: #e8ecf1; color: var(--muted); }
  .session.live {
    border-color: var(--teal);
    border-left-color: var(--teal);
    background: #f0faf7;
    box-shadow: 0 4px 14px rgba(14,102,85,.18);
  }
  .session.live .status { background: var(--teal); color: #fff; display: flex; align-items: center; gap: .3rem; }
  .session.live .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #ff8f8f; animation: pulse 1.2s infinite;
  }
  .session.next { border-color: var(--blue); border-left-color: var(--blue); }
  .session.next .status { background: var(--blue); color: #fff; }
  .session .progress {
    position: absolute; left: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, var(--teal), #27ae8f);
    border-radius: 0 0 0 12px;
    transition: width 30s linear;
  }

  /* ---------- Skills flow ---------- */
  .skills {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.1rem 1rem 1.3rem;
    margin-top: 1.4rem;
    text-align: center;
  }
  .skills h3 { color: var(--navy); font-size: .95rem; margin-bottom: .9rem; }
  .flow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .35rem; }
  .flow .st {
    padding: .45rem .75rem;
    border-radius: 10px;
    font-size: .78rem;
    font-weight: 600;
    color: var(--navy-dark);
  }
  .flow .arrow { color: var(--gold); font-weight: 800; font-size: .9rem; }
  .flow .c1 { background: #fde8e8; } .flow .c2 { background: #e0f7f4; }
  .flow .c3 { background: #e4e8fb; } .flow .c4 { background: #e2f7e4; }
  .flow .c5 { background: #fdefdc; }

  footer {
    text-align: center;
    padding: 1rem 1rem 2rem;
    font-size: .75rem;
    color: var(--muted);
  }
  footer .brand { color: var(--blue); font-weight: 600; }

  @media (max-width: 480px) {
    .session { gap: .6rem; padding: .7rem .75rem; }
    .session .time { min-width: 78px; font-size: .76rem; }
    .session .topic { font-size: .88rem; }
    .live-banner .count { display: none; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="basic-logo.png" alt="BASIC logo">
  <h1>BASIC Provider Course</h1>
  <div class="sub">Basic Assessment and Support in Intensive Care</div>
  <div class="sub">📍 KCB Plaza Auditorium, Upper Hill &nbsp;•&nbsp; 6–7 August 2026</div>
  <div class="clock"><span class="dot"></span><span id="clock">--:--:--</span>&nbsp;EAT</div>
  <div class="gold-bar"></div>
</header>

<div class="live-banner" id="liveBanner" hidden>
  <div class="inner" id="bannerInner">
    <span class="badge" id="bannerBadge"><span class="dot"></span>LIVE NOW</span>
    <div class="info">
      <div class="topic" id="bannerTopic"></div>
      <div class="meta" id="bannerMeta"></div>
    </div>
    <div class="count" id="bannerCount"></div>
  </div>
</div>

<div class="tabs">
  <div class="tab" id="tab0" onclick="selectDay(0)">
    <div class="d">Day 1</div><div class="dt">Thu, 6 Aug 2026</div>
  </div>
  <div class="tab" id="tab1" onclick="selectDay(1)">
    <div class="d">Day 2</div><div class="dt">Fri, 7 Aug 2026</div>
  </div>
</div>

<div class="schedule" id="schedule"></div>

<footer>
  Times shown in East Africa Time (EAT, UTC+3)<br>
  <span class="brand">Basic Assessment and Support in Intensive Care</span>
</footer>

<script>
const DAYS = [
  {
    date: "2026-08-06",
    label: "Day 1",
    sessions: [
      ["06:45","07:00","Registration","Admin"],
      ["07:00","07:15","Introduction to BASIC","Odaba"],
      ["07:15","07:45","Assessing the Critically Ill","Chikophe"],
      ["07:45","08:15","Basic Hemodynamic Monitoring","Odaba"],
      ["08:15","08:45","Shock","Moraa"],
      ["08:45","09:15","Sepsis","Kunga"],
      ["09:15","09:35","Oliguria & AKI","Moraa"],
      ["09:35","09:55","Tea Break & Networking","",true],
      ["09:55","10:20","Principles of Pediatric Critical Care","Kihurani"],
      ["10:20","10:40","Transport of the Critically Ill","Getugi"],
      ["10:40","11:05","Introduction to Mechanical Ventilation","Odaba"],
      ["11:05","11:45","Modes of Mechanical Ventilation","Chikophe"],
      ["11:45","12:15","Non-invasive Ventilation (NIV)","Owambo"],
      ["12:15","13:00","Lunch Break & Networking","",true],
      ["13:00","13:30","Skills: Assessing the Critically Ill","Chikophe"],
      ["13:35","14:05","Skills: Basic Ventilator Settings","Odaba"],
      ["14:10","14:45","Skills: NIV","Moraa / Owambo"],
      ["14:50","15:20","Skills: Transport","Sally"],
      ["15:25","15:55","Skills: Pediatric Emergencies","Kihurani / Kunga"],
      ["16:00","17:00","Tea Break & Networking","All",true]
    ],
    flow: ["Assessment","MV I: Basic Settings","MV II: NIV","MV III: Transport","Pediatrics"]
  },
  {
    date: "2026-08-07",
    label: "Day 2",
    sessions: [
      ["07:00","07:30","Severe Trauma","Getugi"],
      ["07:30","08:00","Neurologic Emergencies","Odaba"],
      ["08:00","08:30","Arrhythmias","Moraa"],
      ["08:30","09:00","Nutrition, DVT & Sedation","Owambo"],
      ["09:00","09:25","Tea Break & Networking","All",true],
      ["09:25","09:55","Mechanical Ventilation: Advanced Settings","Odaba"],
      ["09:55","10:25","Mechanical Ventilation: Troubleshooting","Manguyu"],
      ["10:25","10:45","ABCs of ABGs","Chikophe"],
      ["10:50","11:20","MV: Advanced Settings (HOT)","Odaba / Kunga"],
      ["11:25","11:55","MV: Troubleshooting (HOT)","Manguyu / Owambo"],
      ["12:00","12:30","ABCs of ABGs (Table top)","Chikophe"],
      ["12:35","13:05","Airway (HOT)","Getugi"],
      ["13:10","13:40","Metabolics","Moraa"],
      ["13:45","14:45","Lunch Break & Networking","All",true],
      ["15:00","16:00","Post Test","All"]
    ],
    flow: ["MV IV: Advanced Settings","MV V: Troubleshooting","ABCs of ABGs","Airway","Metabolics"]
  }
];

let currentDay = null;   // user-selected day index, or null = auto
const EAT_OFFSET = "+03:00";

function ts(dateStr, timeStr) {
  return new Date(dateStr + "T" + timeStr + ":00" + EAT_OFFSET).getTime();
}

function nowEATString() {
  return new Intl.DateTimeFormat("en-GB", {
    timeZone: "Africa/Nairobi",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  }).format(new Date());
}

function fmtDur(ms) {
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h > 24) { const d = Math.floor(h / 24); return d + (d === 1 ? " day" : " days"); }
  if (h > 0) return h + "h " + m + "m";
  return m + " min";
}

function autoDayIndex(now) {
  // Before/on day 1's end -> day 1; otherwise day 2
  const endDay1 = ts(DAYS[0].date, "23:59");
  return now > endDay1 ? 1 : 0;
}

function findLive(now) {
  // Search both days for the session that is live or next
  let live = null, next = null;
  for (let d = 0; d < DAYS.length; d++) {
    for (let i = 0; i < DAYS[d].sessions.length; i++) {
      const s = DAYS[d].sessions[i];
      const start = ts(DAYS[d].date, s[0]), end = ts(DAYS[d].date, s[1]);
      if (now >= start && now < end) live = { d, i, s, start, end };
      else if (now < start && !next) next = { d, i, s, start, end };
    }
  }
  return { live, next };
}

function selectDay(idx) {
  currentDay = idx;
  render();
}

function render() {
  const now = Date.now();
  const dayIdx = currentDay === null ? autoDayIndex(now) : currentDay;
  const day = DAYS[dayIdx];

  document.getElementById("tab0").classList.toggle("active", dayIdx === 0);
  document.getElementById("tab1").classList.toggle("active", dayIdx === 1);

  const { live, next } = findLive(now);

  // Banner
  const banner = document.getElementById("liveBanner");
  const inner = document.getElementById("bannerInner");
  const badge = document.getElementById("bannerBadge");
  banner.hidden = false;
  if (live) {
    inner.className = "inner";
    badge.innerHTML = '<span class="dot"></span>LIVE NOW';
    document.getElementById("bannerTopic").textContent = live.s[2];
    document.getElementById("bannerMeta").textContent =
      DAYS[live.d].label + " · " + live.s[0] + " – " + live.s[1] +
      (live.s[3] ? " · " + live.s[3] : "");
    document.getElementById("bannerCount").textContent = fmtDur(live.end - now) + " remaining";
  } else if (next) {
    inner.className = "inner upcoming";
    badge.innerHTML = "UP NEXT";
    document.getElementById("bannerTopic").textContent = next.s[2];
    document.getElementById("bannerMeta").textContent =
      DAYS[next.d].label + " · " + next.s[0] + " – " + next.s[1] +
      (next.s[3] ? " · " + next.s[3] : "");
    document.getElementById("bannerCount").textContent = "starts in " + fmtDur(next.start - now);
  } else {
    inner.className = "inner ended";
    badge.innerHTML = "COMPLETED";
    document.getElementById("bannerTopic").textContent = "The BASIC Provider Course has concluded";
    document.getElementById("bannerMeta").textContent = "Thank you for attending — safe travels!";
    document.getElementById("bannerCount").textContent = "";
  }

  // Schedule list
  const el = document.getElementById("schedule");
  let html = "";
  day.sessions.forEach((s, i) => {
    const start = ts(day.date, s[0]), end = ts(day.date, s[1]);
    const isBreak = !!s[4];
    let cls = "session", status = "";
    if (isBreak) cls += " break";
    if (now >= end) { cls += " done"; status = '<span class="status">✓ DONE</span>'; }
    else if (now >= start) {
      cls += " live";
      status = '<span class="status">LIVE</span>';
    } else if (next && next.d === dayIdx && next.i === i) {
      cls += " next";
      status = '<span class="status">NEXT</span>';
    }
    let bar = "";
    if (now >= start && now < end) {
      const pct = ((now - start) / (end - start) * 100).toFixed(1);
      bar = '<div class="progress" style="width:' + pct + '%"></div>';
    }
    html += '<div class="' + cls + '" id="s-' + dayIdx + '-' + i + '">' +
      '<div class="time">' + s[0] + '<br>' + s[1] + '</div>' +
      '<div class="body"><div class="topic">' + s[2] + '</div>' +
      (s[3] ? '<div class="mod">Moderator: ' + s[3] + '</div>' : '') +
      '</div>' + status + bar + '</div>';
  });

  html += '<div class="skills"><h3>Flow of Skills Stations — ' + day.label + '</h3><div class="flow">';
  day.flow.forEach((st, i) => {
    html += '<span class="st c' + (i + 1) + '">' + st + '</span>';
    if (i < day.flow.length - 1) html += '<span class="arrow">→</span>';
  });
  html += '<span class="arrow">↻</span></div></div>';

  el.innerHTML = html;
}

function tick() {
  document.getElementById("clock").textContent = nowEATString();
}

render();
tick();
setInterval(tick, 1000);
setInterval(render, 30000);
</script>
</body>
</html>
